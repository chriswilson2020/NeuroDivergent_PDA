[platformio]
default_envs = tlora_pager
boards_dir = boards

[env:tlora_pager]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = lilygo-t-lora-pager
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = fatfs
board_build.partitions = partitions.csv
build_type = release
lib_ldf_mode = chain
extra_scripts = pre:support/build_extra.py
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_T_LORA_PAGER
    -D ARDUINO_LILYGO_LORA_SX1262
    -D LV_CONF_INCLUDE_SIMPLE
    -I variants/lilygo_tlora_pager
    -I src
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_BELL
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGoLib.git#0015b6ad7305632bf4da28de3d4079304aa65e64
    lvgl/lvgl @ 9.6.0
    jgromes/RadioLib @ 7.7.1
    lewisxhe/SensorLib @ 0.5.0
    lewisxhe/XPowersLib @ 0.3.1
    adafruit/Adafruit TCA8418 @ 1.0.2
    adafruit/Adafruit BusIO @ 1.17.4
    https://github.com/LennartHennigs/Button2.git#v2.7.0
    mikalhart/TinyGPSPlus @ 1.1.0
    https://github.com/lewisxhe/ST25R3916-NFC-RFAL.git#v1.0.1

; Compatibility alias: same sleep behavior as the default stable firmware.
[env:tlora_pager_sleep_test]
extends = env:tlora_pager
build_flags =
    ${env:tlora_pager.build_flags}
    -D POCKETPDA_EXPERIMENTAL_LIGHT_SLEEP=1
    -D POCKETPDA_LIGHT_SLEEP_MAX_MS=30000

; Optional display-only firmware for troubleshooting without processor sleep.
[env:tlora_pager_awake]
extends = env:tlora_pager
build_flags =
    ${env:tlora_pager.build_flags}
    -D POCKETPDA_EXPERIMENTAL_LIGHT_SLEEP=0
